name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Comprobar que la versión coincide con el tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          HEADER=$(sed -n 's/^ \* Version: *//p' vr-frases.php | head -1)
          CONSTANT=$(sed -n "s/^define( 'VR_FRASES_VERSION', '\(.*\)' );/\1/p" vr-frases.php)
          STABLE=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "tag=$VERSION cabecera=$HEADER constante=$CONSTANT stable=$STABLE"
          [ "$HEADER" = "$VERSION" ] && [ "$CONSTANT" = "$VERSION" ] && [ "$STABLE" = "$VERSION" ] \
            || { echo "La versión del plugin no coincide con el tag ${GITHUB_REF_NAME}"; exit 1; }

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: Instalar dependencias de producción (Plugin Update Checker)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Compilar traducciones
        run: |
          sudo apt-get install -y gettext
          for po in languages/*.po; do msgfmt -o "${po%.po}.mo" "$po"; done

      - name: Create plugin ZIP
        run: |
          mkdir -p dist/wp-citas
          rsync -a \
            --exclude='.git' --exclude='.github' --exclude='.githooks' --exclude='.claude' \
            --exclude='dist' \
            --exclude='composer.json' --exclude='composer.lock' \
            --exclude='phpcs.xml' --exclude='phpstan.neon' --exclude='phpstan-baseline.neon' \
            --exclude='.gitattributes' --exclude='.gitignore' --exclude='.editorconfig' --exclude='AGENTS.md' --exclude='CLAUDE.md' \
            . dist/wp-citas/
          cd dist
          zip -r ../wp-citas.zip wp-citas/

      - name: Deploy a producción
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -e "set sftp:auto-confirm yes; set net:max-retries 3; open -u $SFTP_USERNAME,$SFTP_PASSWORD sftp://$SFTP_HOST; mirror --reverse --delete --verbose dist/wp-citas/ web/wp-content/plugins/wp-citas/; quit"

      - name: Extraer notas de release desde CHANGELOG.md
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          awk "/^## \[${VERSION}\]/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "No se encontró la sección ${VERSION} en CHANGELOG.md" && exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes-file NOTES.md \
            wp-citas.zip
